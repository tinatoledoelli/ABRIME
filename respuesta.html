<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Misión aceptada 🦇</title>
  <style>
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; padding:22px;
      color:#fff; text-align:center; font-family:Arial,Helvetica,sans-serif;
      background:radial-gradient(ellipse at 50% 25%, #293449, #0b1019 58%, #030508);
    }
    .card {
      width:min(92vw,650px); padding:clamp(30px,7vw,58px) 24px;
      border:2px solid #f5c518; border-radius:24px; background:#0b1019ee;
      box-shadow:0 0 40px #f5c51822;
    }
    .bat { font-size:76px; line-height:1; }
    .eyebrow { margin:20px 0 12px; color:#f5c518; font-weight:bold; letter-spacing:4px; font-size:12px; }
    h1 { font-size:clamp(29px,6vw,48px); margin:0 0 18px; }
    p { font-size:clamp(18px,4vw,23px); line-height:1.6; color:#d7dce5; margin:0 auto; max-width:500px; }
    .love { margin-top:24px; font-size:30px; color:#f5c518; }
    .back { display:inline-block; margin-top:30px; color:#f5c518; text-decoration:none; border:1px solid #f5c518; border-radius:999px; padding:12px 20px; }
    .back:hover { background:#f5c518; color:#111; }
  </style>
</head>
<body>
  <main class="card">
    <div class="bat" aria-hidden="true">🦇</div>
    <div class="eyebrow">MISIÓN ACEPTADA</div>
    <h1>¡Sabía que ibas a decir que sí! 🍣</h1>
    <p>Mañana te aviso la hora a la que salgo.</p>
    <div class="love">Te amo 💛</div>
    <a class="back" href="index.html">↩ Volver a Gotham</a>
  </main>
</body>
</html>
